[project]
name = "SwMF-LARD-YOLO-ICPR26"
version = "0.1.0"
description = "Project for ICPR 2026 paper experiment on Monitoring Framework for runway detection on LARD using YOLO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.15.1",
    "ipykernel>=6.30.1",
    "kneed>=0.8.5",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0",
    "pandas>=2.3.3",
    "pyproj==3.7.1",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    "scikit-spatial==9.0.1",
    "scipy>=1.15",
    "tqdm>=4.67",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "ultralytics==8.3.220",
]
gpu = [
    "torch>=2.9.0",
    "torchvision>=0.24.0",
    "ultralytics==8.3.220",
]

[dependency-groups]
full = [
    "ipython",
    "plotly",
    "onnx",
    "onnxruntime",
    "onnxslim",
    "seaborn",
]

[tool.uv]
conflicts = [
    [
        {extra = "cpu"},
        {extra = "gpu"},
    ]
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
